<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resurskarta POC – Livslust</title>

  <!-- MapLibre GL JS – open-source WebGL vector maps, no API key needed -->
  <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    :root {
      --primary:   #2e6b6e;
      --primary-d: #1f4f52;
      --bg:        #f0f8f8;
      --surface:   #ffffff;
      --card:      #e8f5f5;
      --text:      #2c2c2c;
      --muted:     #5e6e6e;
      --border:    #d8e4e4;

      --c-red:    #e05555;
      --c-blue:   #3a8fc0;
      --c-green:  #3aaa5c;
      --c-orange: #e87c25;
      --c-purple: #9b59b6;
      --c-brown:  #c0832a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); }
    body { display: flex; flex-direction: column; background: var(--bg); }

    /* ── Header ── */
    header {
      background: var(--primary); color: #fff;
      padding: 0.65rem 1.2rem;
      display: flex; align-items: center; gap: 0.7rem;
      flex-shrink: 0; z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    .badge { font-size: 0.72rem; background: rgba(255,255,255,0.18); padding: 0.15rem 0.55rem; border-radius: 99px; }
    .stack-note { margin-left: auto; font-size: 0.68rem; opacity: 0.55; }

    /* ── Layout ── */
    .layout { flex: 1; display: flex; min-height: 0; }

    /* ── Sidebar ── */
    aside {
      width: 285px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sb-top {
      padding: 0.8rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .sb-top h2 { font-size: 0.82rem; font-weight: 700; color: var(--primary); margin-bottom: 0.45rem; }
    input[type=text] {
      width: 100%; padding: 0.42rem 0.6rem;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.8rem; background: #fff;
    }
    input[type=text]:focus { outline: 2px solid var(--primary); border-color: transparent; }

    /* Filter chips */
    .chips {
      padding: 0.6rem 0.8rem 0.4rem;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 0.32rem;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 0.26rem;
      padding: 0.2rem 0.6rem; border-radius: 99px;
      font-size: 0.71rem; font-weight: 600;
      cursor: pointer; border: 2px solid transparent;
      transition: all 0.12s; user-select: none;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
    .chip.active { border-color: currentColor; }
    .chip-all    { background: var(--primary); color: #fff; }
    .chip-1 { background: #fde8e8; color: var(--c-red);    }
    .chip-2 { background: #e3f2fd; color: var(--c-blue);   }
    .chip-3 { background: #e8f5e9; color: var(--c-green);  }
    .chip-4 { background: #fff3e0; color: var(--c-orange); }
    .chip-5 { background: #f3e5f5; color: var(--c-purple); }
    .chip-6 { background: #fff8e1; color: var(--c-brown);  }

    .count { font-size: 0.7rem; color: var(--muted); padding: 0.3rem 0.8rem 0.15rem; }

    .res-list { flex: 1; overflow-y: auto; }
    .res-item {
      padding: 0.58rem 0.8rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.1s;
      display: flex; gap: 0.5rem; align-items: flex-start;
    }
    .res-item:hover { background: var(--card); }
    .res-item.active { background: var(--card); border-left: 3px solid var(--primary); padding-left: calc(0.8rem - 1px); }
    .cbar { width: 3px; border-radius: 2px; align-self: stretch; flex-shrink: 0; }
    .rinfo { flex: 1; min-width: 0; }
    .rname { font-size: 0.79rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rmeta { font-size: 0.68rem; color: var(--muted); margin-top: 0.08rem; }
    .rbadge { font-size: 0.65rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 99px; white-space: nowrap; flex-shrink: 0; margin-top: 0.1rem; }

    /* ── Map ── */
    .map-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
    #map { position: absolute; inset: 0; }

    /* MapLibre overrides */
    .maplibregl-ctrl-attrib-inner { font-size: 0.6rem !important; }
    .maplibregl-ctrl-bottom-right { bottom: 136px !important; }

    /* ── Pins ── */
    /* .pin-wrap is an INNER element; the outer wrapper (no class) is the actual
       MapLibre marker element. This separation is critical:
         – MapLibre's .maplibregl-marker{position:absolute} applies to the outer wrapper
           with no CSS conflict.
         – My CSS transforms on .pin-wrap don't fight MapLibre's translate3d.
         – transform-origin:bottom center keeps the pin tip fixed at the
           geographic coordinate when the pin scales/lifts on hover/select. */
    .pin-wrap {
      position: relative;          /* positioning context for .pin-tip */
      display: inline-block;       /* shrink-wrap to SVG size; prevents 100%-width stretch */
      line-height: 0; cursor: pointer;
      transform-origin: bottom center;
      transition: transform 0.15s;
    }
    .pin-svg {
      width: 26px; height: 33px; display: block;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
      transition: filter 0.15s;
    }
    .pin-wrap:hover {
      transform: translateY(-3px);
    }
    .pin-wrap:hover .pin-svg {
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.45)) brightness(1.08);
    }
    .pin-wrap.sel {
      transform: translateY(-4px) scale(1.12);
    }
    .pin-wrap.sel .pin-svg {
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55)) brightness(1.15);
    }
    .pin-tip {
      position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%);
      background: rgba(10,10,10,0.82); color: #fff;
      font-size: 11px; font-weight: 600; font-family: inherit;
      padding: 3px 7px; border-radius: 5px; white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity 0.14s;
      z-index: 200;
    }
    .pin-wrap:hover .pin-tip { opacity: 1; }

    /* ── Info panel ── */
    .panel {
      position: absolute; top: 12px; right: 12px; width: 266px;
      background: var(--surface); border-radius: 12px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.15);
      z-index: 100; overflow: hidden;
      transform: translateX(310px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .panel.open { transform: none; }
    .p-head { padding: 0.8rem 0.85rem 0.45rem; display: flex; gap: 0.45rem; justify-content: space-between; }
    .p-name { font-size: 0.92rem; font-weight: 700; color: var(--primary); line-height: 1.3; }
    .p-close { background: none; border: none; font-size: 1.05rem; cursor: pointer; color: var(--muted); line-height: 1; padding: 0; flex-shrink: 0; margin-top: 1px; }
    .p-cat { padding: 0 0.85rem 0.6rem; }
    .p-body { padding: 0 0.85rem; border-top: 1px solid var(--border); }
    .irow { display: flex; gap: 0.4rem; align-items: flex-start; padding: 0.48rem 0; border-bottom: 1px solid var(--border); font-size: 0.79rem; }
    .irow:last-child { border-bottom: none; }
    .irow .ic { font-size: 0.88rem; flex-shrink: 0; line-height: 1.35; }
    .irow a { color: var(--primary); text-decoration: none; }
    .irow a:hover { text-decoration: underline; }
    .p-desc { padding: 0.6rem 0.85rem 0.75rem; font-size: 0.77rem; color: var(--muted); line-height: 1.55; }
    .p-foot { padding: 0 0.85rem 0.85rem; }
    .p-btn {
      display: block; text-align: center;
      background: var(--primary); color: #fff;
      padding: 0.52rem; border-radius: 8px;
      font-size: 0.82rem; font-weight: 600; text-decoration: none;
    }
    .p-btn:hover { background: var(--primary-d); }

    /* ── National bar ── */
    .nat-bar {
      position: absolute; bottom: 14px; left: 10px; right: 10px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.11);
      padding: 0.55rem 0.8rem;
      display: flex; gap: 0.6rem; align-items: center;
      overflow-x: auto; z-index: 50;
    }
    .nat-bar::-webkit-scrollbar { height: 3px; }
    .nat-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    .nat-label { font-size: 0.68rem; font-weight: 700; color: var(--primary); white-space: nowrap; flex-shrink: 0; }
    .nat-card {
      flex-shrink: 0; background: var(--card);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 0.35rem 0.6rem; cursor: pointer;
      transition: border-color 0.12s;
      min-width: 110px;
    }
    .nat-card:hover { border-color: var(--primary); }
    .nc-name  { font-size: 0.74rem; font-weight: 700; }
    .nc-phone { font-size: 0.68rem; color: var(--primary); font-weight: 600; }
    .nc-desc  { font-size: 0.63rem; color: var(--muted); }
  </style>
</head>

  {name:'Mind självmordslinjen', phone:'90101',        desc:'Dygnet runt',          web:'https://mind.se'},
  {name:'Bris – barnens linje',  phone:'116 111',      desc:'Dygnet runt',          web:'https://bris.se'},
  {name:'SPES rikslinje',        phone:'020-18 18 01', desc:'Mån–tor 10–14',        web:'https://spes.se'},
  {name:'Ätstörningslinjen',     phone:'08-20 59 00',  desc:'Mån–fre 9–16',         web:'https://mind.se'},
  {name:'Mindler',               phone:null,           desc:'100 kr/samtal, frikort',web:'https://mindler.se'},
  {name:'Kry Psykolog',          phone:'08-22 77 07',  desc:'Primärvårdspris, app', web:'https://kry.se/psykolog-online'},
  {name:'AA Telejour',           phone:'08-720 38 42', desc:'Alla dagar 11–20',     web:'https://aa.se'},
  {name:'Al-Anon',               phone:'070-610 96 61',desc:'Mån 19–21',            web:'https://al-anon.se'},
];

// ── Map ────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  // OpenFreeMap: completely free, no API key, no registration
  // Styles: positron (light), liberty (OSM), bright (colorful), dark, fiord
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: [16.0, 63.5],
  zoom: 4.3,
});

let activeFilter = 'all', searchTerm = '', pins = {}, activeId = null;

function pinSvg(color) {
  return `<svg class="pin-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 36">
    <path d="M14 0C6.27 0 0 6.27 0 14c0 10.4 14 22 14 22S28 24.4 28 14C28 6.27 21.73 0 14 0z"
      fill="${color}" stroke="rgba(0,0,0,0.2)" stroke-width="0.8"/>
    <circle cx="14" cy="14" r="5.5" fill="rgba(255,255,255,0.9)"/>
  </svg>`;
}

map.on('load', () => {
  R.forEach(r => {
    const col = (CAT[r.cat]||{color:'#888'}).color;
    // outer: plain div – MapLibre adds maplibregl-marker class + sets position:absolute + transform
    // el (pin-wrap): inner visual element – gets MY hover/sel transforms independently
    const outer = document.createElement('div');
    const el = document.createElement('div');
    el.className = 'pin-wrap';
    el.innerHTML = pinSvg(col) + `<div class="pin-tip">${r.name}</div>`;
    el.addEventListener('click', e => { e.stopPropagation(); openPanel(r.id); });
    outer.appendChild(el);
    const mk = new maplibregl.Marker({element:outer, anchor:'bottom'})
      .setLngLat([r.lng, r.lat]).addTo(map);
    pins[r.id] = {el, outer, mk};
  });
  render(); renderNat();
});

map.on('click', closePanel);

function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.cat===cat));
  render(); updatePins();
}

function getF() {
  return R.filter(r => {
    const c1 = activeFilter==='all' || r.cat===activeFilter;
    const c2 = !searchTerm || r.name.toLowerCase().includes(searchTerm) || (r.city||'').toLowerCase().includes(searchTerm);
    return c1 && c2;
  });
}

function render() {
  const f = getF();
  document.getElementById('cnt').textContent = f.length + ' resurser';
  document.getElementById('resList').innerHTML = f.map(r => {
    const m = CAT[r.cat]||{color:'#888',label:r.cat,bg:'#eee'};
    return `<div class="res-item${activeId===r.id?' active':''}" onclick="focusR('${r.id}')">
      <div class="cbar" style="background:${m.color}"></div>
      <div class="rinfo">
        <div class="rname">${r.name}</div>
        <div class="rmeta">${r.city||''}${r.phone?' · '+r.phone:''}</div>
      </div>
      <span class="rbadge" style="background:${m.bg};color:${m.color}">${m.label}</span>
    </div>`;
  }).join('');
}

function updatePins() {
  const vis = new Set(getF().map(r=>r.id));
  R.forEach(r => { if(pins[r.id]) pins[r.id].outer.style.display = vis.has(r.id)?'':'none'; });
}

function focusR(id) {
  const r = R.find(x=>x.id===id); if(!r) return;
  map.flyTo({center:[r.lng,r.lat], zoom:Math.max(map.getZoom(),9), duration:700});
  openPanel(id);
}

function openPanel(id) {
  if(activeId && pins[activeId]) pins[activeId].el.classList.remove('sel');
  activeId = id;
  const r = R.find(x=>x.id===id); if(!r) return;
  const m = CAT[r.cat]||{color:'#888',label:r.cat,bg:'#eee'};
  if(pins[id]) pins[id].el.classList.add('sel');

  document.getElementById('p-name').textContent = r.name;

  const b = document.getElementById('p-badge');
  b.textContent = m.label;
  Object.assign(b.style,{background:m.bg,color:m.color,padding:'0.18rem 0.65rem',
    borderRadius:'99px',fontSize:'0.76rem',fontWeight:'700',display:'inline-block'});

  let rows = '';
  if(r.phone) rows+=`<div class="irow"><span class="ic">📞</span><a href="tel:${r.phone.replace(/[^\d+]/g,'')}">${r.phone}</a></div>`;
  if(r.city)  rows+=`<div class="irow"><span class="ic">📍</span>${r.city}</div>`;
  document.getElementById('p-body').innerHTML = rows;
  document.getElementById('p-desc').textContent = r.desc;
  document.getElementById('p-foot').innerHTML = `<a class="p-btn" href="${r.web}" target="_blank" rel="noopener">Öppna webbplats →</a>`;
  document.getElementById('panel').classList.add('open');
  render();
}

function closePanel() {
  if(activeId && pins[activeId]) pins[activeId].el.classList.remove('sel');
  activeId = null;
  document.getElementById('panel').classList.remove('open');
  render();
}

function renderNat() {
  document.getElementById('natBar').innerHTML =
    `<div class="nat-label">🌐 Nationellt</div>` +
    NAT.map(n=>`<div class="nat-card" onclick="window.open('${n.web}','_blank')">
      <div class="nc-name">${n.name}</div>
      ${n.phone?`<div class="nc-phone">${n.phone}</div>`:''}
      <div class="nc-desc">${n.desc}</div>
    </div>`).join('');
}

document.getElementById('searchInput').addEventListener('input', function(){
  searchTerm = this.value.toLowerCase().trim();
  render(); updatePins();
});
</script>
