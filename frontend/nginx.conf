server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Container only ever speaks plain HTTP; without this, nginx's automatic
    # directory-redirect (e.g. /blog/slug -> /blog/slug/) emits an absolute
    # http:// Location header, downgrading the scheme behind the HTTPS proxy —
    # which social-media link crawlers refuse to follow.
    absolute_redirect off;

    # SPA routing — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
